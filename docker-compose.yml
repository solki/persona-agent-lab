services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-swarm-lab-postgres
    environment:
      POSTGRES_DB: agent_lab
      POSTGRES_USER: agent_lab
      POSTGRES_PASSWORD: agent_lab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_lab -d agent_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
